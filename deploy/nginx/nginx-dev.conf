# pi-agent 平台 Nginx 配置 — 开发环境
# 角色：统一入口，宿主机只暴露一个端口
#
# 路由:
#   /          → 先尝试 Angular DevServer，失败则回退到 Hyperf
#   /service/  → Hyperf 后端 (hyperf:9501)
#   /ws        → pi-gateway WebSocket (pi-gateway:3002)
#   /health    �� pi-gateway Health Check

upstream hyperf_backend {
    server hyperf:9501;
    keepalive 64;
}

upstream pi_gateway {
    server pi-gateway:3002;
    keepalive 16;
}

upstream web_devserver {
    server web:4200;
    keepalive 16;
}

# WebSocket 升级 map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 128M;

    # ===== 调试信息（开发环境专用）=====
    add_header X-Upstream "dev-nginx" always;

    # ===== pi-gateway WebSocket =====
    location /ws {
        proxy_pass http://pi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== pi-gateway Health Check =====
    location /health {
        proxy_pass http://pi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ===== Hyperf 后端 /service/* =====
    location /service/ {
        proxy_pass http://hyperf_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ===== Angular DevServer /ng-cli-ws (HMR) =====
    location /ng-cli-ws {
        proxy_pass http://web_devserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    # ===== Angular DevServer /sockjs-node (HMR) =====
    location /sockjs-node {
        proxy_pass http://web_devserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    # ===== 伪静态回退：先前端，不存在则后端 =====
    location / {
        # 先尝试 Angular DevServer
        proxy_pass http://web_devserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # HMR 长连接不超时

        # 拦截 404/502/504，回退到后端
        proxy_intercept_errors on;
        error_page 404 502 504 = @backend;
    }

    # ===== 回退到 Hyperf 后端 =====
    location @backend {
        proxy_pass http://hyperf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
