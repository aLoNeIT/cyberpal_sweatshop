# pi-agent 平台 Nginx 配置 — 开发环境
# 角色：统一入口，宿主机只暴露一个端口
#
# 路由:
#   /          → Angular DevServer (web:4200)  前端
#   /service/  → Hyperf 后端 (hyperf:9501)      后端 API
#   /ws        → pi-gateway WebSocket (pi-gateway:3002)
#   /health    → pi-gateway Health Check

upstream hyperf_backend {
    server hyperf:9501;
    keepalive 64;
}

upstream pi_gateway {
    server pi-gateway:3002;
    keepalive 16;
}

upstream web_devserver {
    server web:4200;
    keepalive 16;
}

# WebSocket 升级 map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 128M;

    # ===== 调试信息（开发环境专用）=====
    add_header X-Upstream "dev-nginx" always;

    # ===== Hyperf 后端 /service/* =====
    location /service/ {
        proxy_pass http://hyperf_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ===== pi-gateway WebSocket =====
    location /ws {
        proxy_pass http://pi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== pi-gateway Health Check =====
    location /health {
        proxy_pass http://pi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ===== Angular DevServer (WebSocket HMR 支持) =====
    location / {
        proxy_pass http://web_devserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # HMR 长连接不超时
    }

    # ===== Angular DevServer /ng-cli-ws =====
    location /ng-cli-ws {
        proxy_pass http://web_devserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    # ===== Angular DevServer /sockjs-node =====
    location /sockjs-node {
        proxy_pass http://web_devserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
