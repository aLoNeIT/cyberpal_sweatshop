# =========================================================================
# docker-compose-dev.yml — 本地开发环境（精简版）
#
# 使用方式:
#   1. 复制 deploy/.env.example 为 deploy/.env.dev（按需调整）
#   2. 启动全部: docker compose -f docker-compose-dev.yml --env-file .env.dev up -d
#   3. 启动单服务: docker compose -f docker-compose-dev.yml up -d web
#   4. 查看日志: docker compose -f docker-compose-dev.yml logs -f
#   5. 停止: docker compose -f docker-compose-dev.yml down
#
# 服务清单:
#   nginx        — 反向代理统一入口，宿主机只暴露此端口
#   hyperf       — PHP/Swoole 后端（hyperf/watcher 热更新）
#   pi-gateway   — Bun WebSocket 网关（bun --watch 热更新）
#   web          — Angular 前端 DevServer（原生 HMR）
#
# 路由:
#   http://host:port/          → 前端项目
#   http://host:port/service/  → 后端 API
#   ws://host:port/ws          → WebSocket 网关
#
# 所有数据均通过宿主机目录映射，不创建 Docker 托管卷。
# Hyperf 的 DB/Redis 连接从 service/.env 读取，无需在此配置。
# =========================================================================

services:
  # =========================================================================
  # Hyperf — PHP/Swoole 后端（热更新）
  #
  # 热更新: hyperf/watcher，修改 PHP 代码后自动重启
  # 源码挂载: ../service → /opt/www（直接映射，vendor 写入宿主机）
  # =========================================================================
  hyperf:
    image: hyperf/hyperf:8.3-alpine-v3.21-swoole
    container_name: cyberpal-hyperf-dev
    volumes:
      # 源码直接映射到宿主机目录（vendor 也写入宿主机）
      - ../service:/opt/www
      # Pi Agent 模型配置（只读）
      - ../service/pi-config/models.json:/root/.pi/agent/models.json:ro
    working_dir: /opt/www
    command: ["php", "bin/hyperf.php", "server:watch"]
    restart: unless-stopped
    networks:
      - dev-net

  # =========================================================================
  # pi-gateway — Bun WebSocket 网关（热更新）
  #
  # 热更新: bun --watch 原生支持，修改 TypeScript 后自动重启
  # 配置: bun --env-file .env 加载 gateway/.env
  # 数据: SQLite 写入宿主机 ../gateway/data 目录
  # =========================================================================
  pi-gateway:
    image: oven/bun:1-alpine
    container_name: cyberpal-gateway-dev
    volumes:
      # 网关源码（直接映射到宿主机）
      - ../gateway:/app
      # SQLite 数据持久化到宿主机目录
      - ../gateway/data:/data
      # 权限策略配置（只读）
      - ./pi/permission.config.json:/etc/pi/permission.config.json:ro
      # workspace（agent 工作目录，只读）
      - ../service:/workspace:ro
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command: ["bun --env-file=.env run --watch src/server.ts"]
    restart: unless-stopped
    networks:
      - dev-net

  # =========================================================================
  # web — Angular 前端 DevServer（HMR 热更新）
  #
  # 热更新: Angular DevServer 原生 HMR，修改代码后浏览器自动刷新
  # --poll 2000 解决 Windows 宿主机文件系统事件不触发的问题
  # =========================================================================
  web:
    image: node:22-alpine
    container_name: cyberpal-web-dev
    volumes:
      # 前端源码直接映射到宿主机目录（node_modules 也写入宿主机）
      - ../web:/app
    working_dir: /app
    command: ["npx", "ng", "serve", "--host", "0.0.0.0", "--port", "4200", "--poll", "2000", "--disable-host-check"]
    restart: unless-stopped
    networks:
      - dev-net

  # =========================================================================
  # Nginx — 反向代理统一入口（宿主机唯一暴露端口）
  #
  # 路由（伪静态回退）:
  #   /          → web:4200（失败则回退到 hyperf:9501）
  #   /service/  → hyperf:9501   后端 API
  #   /ws        → pi-gateway:3002  WebSocket 网关
  #   /health    → pi-gateway:3002  健康检查
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: cyberpal-nginx-dev
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - hyperf
      - pi-gateway
      - web
    restart: unless-stopped
    networks:
      - dev-net

# =========================================================================
# Networks
# =========================================================================
networks:
  dev-net:
    name: cyberpal-dev-network
    driver: bridge
