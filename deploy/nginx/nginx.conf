# pi-agent 平台 Nginx 配置
# 角色：反向代理 + WebSocket 升级

upstream hyperf_backend {
    server hyperf:9502;
    keepalive 64;
}

upstream pi_gateway {
    server pi-gateway:3002;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 128M;

    # ===== Hyperf API（HTTP）=====
    location / {
        proxy_pass http://hyperf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ===== pi-gateway WebSocket =====
    # Hyperf 通过此路径连接网关 WS
    location /ws {
        proxy_pass http://pi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;       # 长任务不超时
        proxy_send_timeout 3600s;
    }

    # ===== pi-gateway Health Check =====
    location /health {
        proxy_pass http://pi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
